<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Face preview</title>
<style>
	body { margin: 0; font: 16px/1.4 -apple-system, system-ui, sans-serif; background: #111; color: #eee; display: grid; place-items: center; min-height: 100vh; gap: 12px; padding: 16px; box-sizing: border-box }
	#disc { width: min(80vw, 70vh, 720px); aspect-ratio: 1; border-radius: 50%; overflow: hidden; background: #000; outline: 2px solid #333 }
	#err { color: #f88; font-family: ui-monospace, monospace; min-height: 1.4em }
	label { display: flex; gap: 8px; align-items: center }
	a { color: #8cf }
</style>
</head>
<body>
<h1 id="title" style="margin:0;font-size:20px">Preview</h1>
<div id="disc"></div>
<label>Test time <input id="time" placeholder="18:00 (blank = live)" size="18"> <button id="live">Live</button></label>
<div id="err"></div>
<a href="/">Back</a>
<script src="/host.js"></script>
<script>
	var params = new URLSearchParams(location.search)
	var id = params.get("id")
	var cfg = { size: Number(params.get("size")) || 720, tz: params.get("tz") || undefined, time: params.get("time") || undefined }
	var mounted
	var err = document.getElementById("err")
	var timeInput = document.getElementById("time")
	timeInput.value = cfg.time || ""
	async function load() {
		var meta = await fetch("/api/v1/faces/" + encodeURIComponent(id)).then(function (r) { if (!r.ok) throw new Error("face not found"); return r.json() })
		document.getElementById("title").textContent = meta.name
		var src = await fetch(meta.sourceUrl).then(function (r) { return r.text() })
		mounted = FaceHost.mount(document.getElementById("disc"), src, cfg, function (m) { err.textContent = m })
	}
	timeInput.addEventListener("input", function () { mounted && mounted.setTime(timeInput.value) })
	document.getElementById("live").addEventListener("click", function () { timeInput.value = ""; mounted && mounted.setTime(null) })
	load().catch(function (e) { err.textContent = e.message })
</script>
</body>
</html>
