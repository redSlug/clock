<!doctype html>
<html lang="en">
<head>
<script src="/redirect.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clock</title>
<link rel="stylesheet" href="/theme.css">
<style>
	body { max-width: 760px; margin: 2.5rem auto }
	h1 { text-align: center; font-size: 3rem; line-height: 1.1; letter-spacing: .03em; margin: .2em 0 .1em; text-shadow: 2px 2px 0 rgba(255,255,255,.55) }
	h1 + .muted { text-align: center; font-style: italic }
	.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(47,93,39,.2) }
	.row .name { flex: 1; min-width: 180px }
	.paused .name { opacity: .5 }
	.badge { font-size: 12px; background: #fff8c5; border: 1px solid #d4a72c; border-radius: 10px; padding: 0 8px }
	.info { display: flex; gap: 1.5rem; align-items: flex-start; justify-content: space-between; margin: 1rem 0 }
	.info p { margin: 0 }
	.info .footer { font-size: 10px; opacity: .7; text-align: right; flex: 0 0 150px }
	#faces { padding: 0 }
</style>
</head>
<body>
<script src="/theme.js"></script>
<div class="paper">
<h1>Clock</h1>
<p class="muted">Clock faces for a round display. <a href="/display">Open the display page</a>.</p>

<p id="who">Loading…</p>
<p><a class="btn" href="/editor">+ New face</a></p>

<div class="info">
<p class="muted">Anyone signed in can pause, resume or delete any face. A paused face stays saved but is skipped by the display.</p>
<p class="muted footer">Open source (MIT) on <a href="https://github.com/redSlug/clock">GitHub</a>. Made by <a href="https://github.com/redSlug">redSlug</a> and <a href="https://github.com/fcjr">fcjr</a>.</p>
</div>

<h2>Faces</h2>
<div id="faces"></div>

</div>

<script>
	var $ = function (id) { return document.getElementById(id) }
	var me = null

	async function api(path, opts) {
		var res = await fetch("/api/v1" + path, opts)
		var body = res.status === 204 ? null : await res.json().catch(function () { return null })
		if (!res.ok) throw new Error((body && body.error) || "request failed: " + res.status)
		return body
	}

	function renderWho() {
		var who = $("who")
		who.textContent = ""
		if (me) {
			who.append("Signed in as " + me.name + " ")
			var out = document.createElement("button")
			out.textContent = "Sign out"
			out.onclick = async function () {
				await fetch("/api/v1/auth/sign-out", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" })
				location.reload()
			}
			who.append(out)
		} else {
			var inb = document.createElement("button")
			inb.textContent = "Sign in with Recurse"
			inb.onclick = async function () {
				var r = await fetch("/api/v1/auth/sign-in/social", {
					method: "POST",
					headers: { "Content-Type": "application/json" },
					body: JSON.stringify({ provider: "recurse", callbackURL: "/" }),
				}).then(function (x) { return x.json() })
				location.href = r.url
			}
			who.append(inb)
		}
	}

	function link(text, href) {
		var a = document.createElement("a")
		a.className = "btn"; a.href = href; a.textContent = text
		return a
	}
	function button(text, title, onclick) {
		var b = document.createElement("button")
		b.textContent = text; b.title = title; b.onclick = onclick
		return b
	}

	async function renderFaces() {
		var list = $("faces")
		list.textContent = ""
		var faces = await api("/faces")
		if (!faces.length) list.textContent = "No faces yet."
		faces.forEach(function (f) {
			var row = document.createElement("div")
			row.className = "row" + (f.active ? "" : " paused")
			var name = document.createElement("span")
			name.className = "name"
			var a = document.createElement("a")
			a.href = "/preview?id=" + f.id
			a.textContent = f.name // textContent, never innerHTML: names are user input
			name.append(a, " by " + f.author)
			row.append(name)
			if (!f.active) { var b = document.createElement("span"); b.className = "badge"; b.textContent = "paused"; row.append(b) }
			row.append(link(me && me.id === f.userId ? "Edit" : "View code", "/editor?id=" + f.id))
			if (me) {
				row.append(button(f.active ? "⏸ Pause" : "▶ Resume", f.active ? "Hide from the display rotation" : "Put back in the display rotation", async function () {
					try { await api("/faces/" + f.id, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ active: !f.active }) }) } catch (e) { alert(e.message) }
					renderFaces()
				}))
				var del = button("Delete", "Delete this face for everyone", async function () {
					if (!confirm("Delete \"" + f.name + "\" by " + f.author + "? This cannot be undone.")) return
					try { await api("/faces/" + f.id, { method: "DELETE" }) } catch (e) { alert(e.message) }
					renderFaces()
				})
				del.className = "danger"
				row.append(del)
			}
			list.append(row)
		})
	}

	api("/me").then(function (u) { me = u }, function () { me = null }).then(function () { renderWho(); return renderFaces() }).catch(function (e) { $("faces").textContent = e.message })
</script>
</body>
</html>
