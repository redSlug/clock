# CI/CD: checks every pull request and every push to main. A push to main that passes the checks is
# deployed to Cloudflare (database migrations first, then the Worker).
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer run on the same branch cancels the older one, so checks don't pile up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Type-check and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  deploy:
    name: Deploy to Cloudflare
    needs: check
    # Only on pushes to main, never on pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    # Never run two deploys at once, and never cancel one that is half done.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check the deploy token exists
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Repository secret CLOUDFLARE_API_TOKEN is not set. Run: gh secret set CLOUDFLARE_API_TOKEN"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Migrations are additive and tracked by wrangler, so re-running is safe. They go before the new code.
      - name: Apply database migrations
        run: npm run db:migrate:remote
      - name: Deploy the Worker
        run: npm run deploy
      - name: Check the live site
        run: |
          url=$(grep -oE '"BASE_URL"[[:space:]]*:[[:space:]]*"[^"]+"' wrangler.jsonc | sed -E 's/.*"([^"]+)"$/\1/')
          echo "Checking $url"
          for i in 1 2 3 4 5; do
            if curl -fsS "$url/api/v1/health" | grep -q '"ok":true'; then echo "healthy"; exit 0; fi
            sleep 5
          done
          echo "::error::$url/api/v1/health did not respond after the deploy"; exit 1
